rules:
  - id: large-patch-hunk
    message: 单文件变更行数较多，建议拆分为更小 PR 便于审阅
    severity: LOW
    metadata:
      min_changed_lines: 100
      suggestion: 若变更确有必要，请在 PR 描述中说明范围与拆分计划；否则建议拆成多个小 PR。
    match: {}

  - id: ci-config-changed
    message: CI/工作流配置发生变更，请确认流水线与安全权限
    severity: MEDIUM
    paths:
      include: [".github/**", "**/gitlab-ci.yml", "**/azure-pipelines.yml"]
    match:
      any:
        - pattern-regex: '.+'
          target: file_path

  - id: dockerfile-changed
    message: Dockerfile 变更可能影响镜像安全与构建，请复核基础镜像与权限
    severity: MEDIUM
    languages: [docker, config]
    paths:
      include: ["**/Dockerfile", "**/Dockerfile.*"]
    match:
      any:
        - pattern-regex: '.+'
          target: file_path

  - id: dockerfile-root-user
    message: Dockerfile 新增 USER root，存在特权运行风险
    severity: HIGH
    languages: [docker, config]
    paths:
      include: ["**/Dockerfile", "**/Dockerfile.*"]
    match:
      all:
        - pattern-regex: '.+'
          target: file_path
        - pattern-regex: 'USER\s+root'
          target: patch_hunk
          patch_scope: added_only

  - id: test-file-removed
    message: 测试相关文件被删除或大量移除，请确认测试覆盖未回退
    severity: MEDIUM
    paths:
      include: ["**/test/**", "**/tests/**", "**/*_test.*", "**/*.test.*", "**/*.spec.*"]
    metadata:
      min_removed_lines: 10
      min_removed_ratio: 0.25
      requires_removed_signal: true
      suggestion: 确认删除测试是否 intentional；若覆盖回退请补测试或说明原因。
    match: {}
