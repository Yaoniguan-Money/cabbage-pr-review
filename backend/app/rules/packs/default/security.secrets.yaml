rules:
  - id: patch-hardcoded-secret
    message: 补丁新增行疑似硬编码密钥或密码，请改用环境变量或密钥管理服务
    severity: HIGH
    languages: [python, typescript, javascript, config]
    paths:
      include: ["**/*"]
      exclude: ["**/*.test.*", "**/tests/**", "**/fixtures/**"]
    match:
      any:
        - pattern-regex: '(?i)(api[_-]?key|secret|password|token)\s*=\s*\S+'
          target: patch_hunk

  - id: env-file-committed
    message: 变更涉及 .env 类文件，请确认未提交真实密钥
    severity: HIGH
    paths:
      include: ["**/.env", "**/.env.*"]
      exclude: ["**/.env.example", "**/.env.sample"]
    match:
      any:
        - pattern-regex: '.+'
          target: file_path
