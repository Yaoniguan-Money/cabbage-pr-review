# 可选附录：Mock LLM 展示完整 Agent 四图 UI（非规则引擎主叙事）
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.demo-mock
    environment:
      - DEMO_PATCHES_DIR=/app/data/demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
