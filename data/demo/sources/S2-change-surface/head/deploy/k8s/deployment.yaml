apiVersion: apps/v1
kind: Deployment
metadata:
  name: change-surface-api
  namespace: demo
  labels:
    app.kubernetes.io/name: change-surface-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: change-surface
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: change-surface-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: change-surface-api
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        deploy.timestamp: "${DEPLOY_TIMESTAMP}"
    spec:
      serviceAccountName: change-surface-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/demo-org/change-surface-api:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENV
              value: staging
            - name: APP_PORT
              value: "8080"
            - name: LOG_LEVEL
              value: debug
            - name: METRICS_ENABLED
              value: "true"
            - name: REQUEST_TIMEOUT_SECONDS
              value: "45"
          envFrom:
            - configMapRef:
                name: change-surface-api-config
            - secretRef:
                name: change-surface-api-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 8
            periodSeconds: 8
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: change-surface-api
  namespace: demo
  labels:
    app.kubernetes.io/name: change-surface-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: change-surface-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: change-surface-api-config
  namespace: demo
data:
  APP_BIND: "0.0.0.0"
  LOG_LEVEL: "info"
  DEPLOY_REGION: "us-east-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: change-surface-api-secrets
  namespace: demo
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://otel.staging.change-surface.demo"
  INTERNAL_API_TOKEN: "replace-me-in-vault"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: change-surface-api
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: change-surface-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
