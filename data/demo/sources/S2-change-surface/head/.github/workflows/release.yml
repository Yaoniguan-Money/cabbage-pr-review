name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag to publish"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/demo-org/change-surface-api
  COSIGN_EXPERIMENTAL: "true"

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          python scripts/build.sh changelog "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG_SNIPPET.md

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push release image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            PYTHON_VERSION=3.12
          provenance: true
          sbom: true

      - name: Sign container image
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign
        run: cosign sign --yes "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  notify:
    name: Notify maintainers
    runs-on: ubuntu-latest
    needs: release
    if: always()
    steps:
      - name: Print release summary
        run: echo "Release ${{ github.ref_name }} finished with status ${{ job.status }}"

  container-scan:
    name: Scan release image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: table
          exit-code: 0

  sbom-upload:
    name: Upload SBOM artifact
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom

      - name: Archive SBOM
        run: tar -czf sbom-${{ github.ref_name }}.tar.gz sbom

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-${{ github.ref_name }}.tar.gz

  policy-check:
    name: OPA policy gate
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout policy bundle
        uses: actions/checkout@v4
        with:
          repository: demo-org/k8s-policies
          path: policies

      - name: Evaluate deployment policy
        run: |
          docker run --rm -v "$PWD/policies:/policies" openpolicyagent/opa:latest \
            eval -i deploy/k8s/deployment.yaml -d /policies "data.demo.allow"

  smoke-test:
    name: Post-release smoke test
    runs-on: ubuntu-latest
    needs: policy-check
    if: success()
    steps:
      - name: Hit readiness endpoint
        run: |
          curl -fsS https://staging.change-surface.demo/health/ready
          curl -fsS https://staging.change-surface.demo/api/v1/info

  load-test:
    name: Post-release load sample
    runs-on: ubuntu-latest
    needs: smoke-test
    if: success()
    steps:
      - name: Sample staging traffic
        run: docker run --rm rakyll/hey -n 50 -c 5 https://staging.change-surface.demo/health/live

  slack:
    name: Slack notification
    runs-on: ubuntu-latest
    needs: smoke-test
    if: success()
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Released change-surface-api ${{ github.ref_name }}"}' \
            "$SLACK_WEBHOOK"
