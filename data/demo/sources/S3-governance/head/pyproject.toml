[project]
name = "governance-demo"
version = "0.4.0"
description = "依赖与测试治理演示后端"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "marshmallow>=3.21,<4",
  "structlog>=24.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

# pyp-anchor-01
# pyp-anchor-02
# pyp-anchor-03

[tool.coverage.run]
branch = true
source = ["src/app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.black]
line-length = 100
target-version = ["py311"]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "ruff>=0.3",
  "mypy>=1.9",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options.markers]
integration = "integration level tests"
slow = "long running tests"

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"
line_length = 100

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pylint.messages_control]
disable = ["missing-module-docstring"]

[tool.pylint.format]
max-line-length = 100
