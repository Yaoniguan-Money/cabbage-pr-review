[project]
name = "governance-demo"
version = "0.4.0"
description = "依赖与测试治理演示后端"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
  "marshmallow>=3.21,<4",
  "structlog>=24.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

