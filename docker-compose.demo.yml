# 评委演示：默认纯规则引擎（零 API Key / 零 Ollama / 零 Mock）
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.demo
    environment:
      - DEMO_PATCHES_DIR=/app/data/demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
