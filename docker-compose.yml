services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    # 其余变量（含 GITHUB_TOKEN）仅从 env_file: .env 注入，避免宿主机空变量覆盖 .env
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-false}
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
