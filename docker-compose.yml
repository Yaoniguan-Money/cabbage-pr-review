# 默认零密钥体验：先加载 .env.demo（rules_only），若存在 .env 则覆盖（生产/带 Key）
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env.demo
        required: true
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - USE_MOCK_LLM=${USE_MOCK_LLM:-false}
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      - DEMO_PATCHES_DIR=/app/data/demo

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
